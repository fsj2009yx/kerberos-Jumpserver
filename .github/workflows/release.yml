name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  go-and-certs:
    name: Build Go servers and generate certs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go server binaries
        run: make build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certificate script dependencies
        run: python -m pip install --upgrade pip cryptography

      - name: Generate client and V certificates
        run: |
          python script/client/init_cert.py 1 --root "$PWD"
          python script/v_server/init_cert.py --root "$PWD"

      - name: Collect Go and certificate artifacts
        run: |
          mkdir -p release-assets
          cp as-server-linux tgs-server-linux v-server-linux release-assets/
          cp as-server-win.exe tgs-server-win.exe v-server-win.exe release-assets/
          tar -czf release-assets/generated-certs.tar.gz certs keys client/certs client/keys

      - name: Upload Go and certificate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-and-certs
          path: release-assets/*
          if-no-files-found: error

  electron:
    name: Build Electron client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: client/web
        run: npm ci

      - name: Build Python proxy executable
        working-directory: client/proxy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller `
            --name krb-client-proxy `
            --onefile `
            --clean `
            --paths . `
            --add-data "client_config.json;." `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            main.py

      - name: Build renderer and main process
        working-directory: client/web
        run: npm run build

      - name: Package Electron app
        working-directory: client/web
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Collect Electron artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem -Path client/web/dist -File |
            Where-Object { $_.Extension -in ".exe", ".zip", ".blockmap", ".yml" } |
            Copy-Item -Destination release-assets -Force

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-client
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - go-and-certs
      - electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
