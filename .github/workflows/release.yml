name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  go-and-certs:
    name: Build Go servers and collect certs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64

      - name: Verify SQLite support
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test ./verify_server/service/...

      - name: Build Go server binaries
        run: |
          make linux CGO_ENABLED=1 CC=gcc
          make windows CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc

      - name: Validate repository certificates
        run: |
          required=(
            "certs/v_cert.json"
            "certs/client1_cert.json"
            "certs/client2_cert.json"
            "certs/client3_cert.json"
            "certs/client4_cert.json"
            "keys/v_priv.json"
            "client/certs/cert_client.json"
            "client/keys/client_priv.json"
          )
          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "Missing repository certificate/key file: $path" >&2
              exit 1
            }
          done

      - name: Collect Go and certificate artifacts
        run: |
          mkdir -p release-assets
          cp as-server-linux tgs-server-linux v-server-linux release-assets/
          cp as-server-win.exe tgs-server-win.exe v-server-win.exe release-assets/
          tar -czf release-assets/generated-certs.tar.gz certs keys client/certs client/keys

      - name: Upload Go and certificate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-and-certs
          path: release-assets/*
          if-no-files-found: error

  electron:
    name: Build Electron client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: client/web
        run: npm ci

      - name: Build Python proxy executable
        working-directory: client/proxy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller `
            --name krb-client-proxy `
            --onefile `
            --clean `
            --paths . `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            main.py

      - name: Build renderer and main process
        working-directory: client/web
        run: npm run build

      - name: Validate Electron package inputs
        shell: pwsh
        run: |
          $required = @(
            "client/proxy/dist/krb-client-proxy.exe",
            "client/web/package-config/proxy/client_config.json",
            "client/certs/cert_client.json",
            "client/keys/client_priv.json",
            "certs/v_cert.json"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path -PathType Leaf)) {
              Write-Error "Missing Electron package input: $path"
              exit 1
            }
          }

      - name: Package Electron app
        working-directory: client/web
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Collect Electron artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem -Path client/web/dist -File |
            Where-Object { $_.Extension -in ".exe", ".zip", ".blockmap" -or $_.Name -eq "latest.yml" } |
            Copy-Item -Destination release-assets -Force

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-client
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - go-and-certs
      - electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Download Go artifacts from this run
        uses: actions/download-artifact@v4
        with:
          name: go-and-certs
          path: release-assets

      - name: Download Electron artifacts from this run
        uses: actions/download-artifact@v4
        with:
          name: electron-client
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Fresh Linux and Windows server builds and an updated Windows client.

          Local deployment settings and personal contributor details are excluded from this release.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
